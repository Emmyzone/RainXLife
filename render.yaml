services:
  - type: web
    name: rainxlife
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: rainxlife-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_NAME
        value: RainXLife
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIKTOK_URL
        sync: false
      - key: YOUTUBE_URL
        sync: false
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_ENABLED
        value: "false"
      - key: DATABASE_PATH
        value: ./data/rainxlife.db
      - key: NODE_ENV
        value: production
